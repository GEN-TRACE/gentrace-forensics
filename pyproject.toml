[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gentrace-forensics"
version = "0.1.0"
description = "GEN-TRACE 연구용 포렌식 도구: Chrome 캐시에서 생성형 AI 아티팩트 획득·분류·정규화"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "GEN-TRACE" },
]
dependencies = [
  "pydantic>=2",
  "python-dateutil",
  "tldextract",
  "brotli",
]

[project.optional-dependencies]
acquisition = ["libewf-python", "pytsk3"]
# ccl_chromium_reader 는 PyPI 미배포 → GitHub 에서 설치 (blockfile 파서 참조·교차검증용)
reference   = ["ccl_chromium_reader @ git+https://github.com/cclgroupltd/ccl_chromium_reader"]
dev         = ["pytest", "ruff", "mypy", "bandit", "pip-audit"]

[project.scripts]
gentrace = "gentrace_forensics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gentrace_forensics"]

[tool.hatch.metadata]
# reference extra 가 git+ 직접 참조를 쓰므로 필요
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
# editable 설치가 실패해도(구버전 pip 등) 테스트는 src/ 를 찾을 수 있게
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
