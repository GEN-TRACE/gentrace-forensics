[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gentrace-forensics"
version = "0.1.0"
description = "GEN-TRACE 연구용 포렌식 도구: Chrome 캐시에서 생성형 AI 아티팩트 획득·분류·정규화"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "GEN-TRACE" },
]
dependencies = [
  "pydantic>=2",
  "python-dateutil",
  "tldextract",
  "brotli",
]

[project.optional-dependencies]
acquisition = ["libewf-python", "pytsk3"]
reference   = ["ccl-chromium-reader"]
dev         = ["pytest", "ruff", "mypy", "bandit", "pip-audit"]

[project.scripts]
gentrace = "gentrace_forensics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gentrace_forensics"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
